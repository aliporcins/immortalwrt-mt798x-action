name: ax3000t immortalwrt-mt798x Builder

on:
  repository_dispatch:
  workflow_dispatch:
  watch:
    types: started

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: mt7981-ax3000t.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: false
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # 清理磁盘空间
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        
        # 更新软件源
        sudo -E apt-get update -qq
        
        # 安装 clang/llvm（eBPF 编译需要）
        sudo -E apt-get install -y -qq clang-15 llvm-15
        
        # 安装 Go（dae 编译需要）
        sudo -E apt-get install -y -qq golang-go
        
        # 安装全部编译依赖
        sudo -E apt-get install -y -qq \
          dwarves ack antlr3 asciidoc autoconf automake autopoint binutils bison \
          build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar \
          flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man \
          intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
          libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev \
          libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp \
          ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 \
          python3-pyelftools python3-setuptools qemu-utils rsync scons \
          squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim \
          wget xmlto xxd zlib1g-dev
        
        # 设置 clang 为默认
        sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-15 100
        sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-15 100
        
        # 清理缓存
        sudo -E apt-get autoremove -y -qq --purge
        sudo -E apt-get clean -qq
        
        # 设置时区
        sudo timedatectl set-timezone "$TZ"
        
        # 创建工作目录
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
        
        # Git 全局配置（解决网络问题）
        git config --global url."https://".insteadOf git://
        git config --global core.compression 0
        git config --global http.postBuffer 1048576000
        git config --global http.lowSpeedLimit 0
        git config --global http.lowSpeedTime 999999
        
        # 验证工具
        clang --version
        go version

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: |
        cd openwrt
        
        echo "=== Network Diagnostics ==="
        echo "Resolving github.com..."
        nslookup github.com || echo "⚠️ DNS lookup failed"
        echo "Testing GitHub connectivity..."
        curl -s -o /dev/null -w "GitHub HTTP Status: %{http_code}\n" https://github.com || echo "⚠️ GitHub connection failed"
        
        echo "=== feeds.conf.default content ==="
        cat feeds.conf.default
        
        # ==========================================
        # 逐个更新 feed，失败时重试
        # ==========================================
        echo "=== Updating feeds individually with retry ==="
        
        # 获取所有 feed 名称
        FEEDS=$(grep -E '^src-git|^src-svn' feeds.conf.default | awk '{print $2}')
        
        for feed in $FEEDS; do
          echo "📦 Updating feed: $feed"
          for attempt in {1..3}; do
            echo "  Attempt $attempt for $feed..."
            if ./scripts/feeds update $feed; then
              echo "  ✅ Feed $feed updated successfully."
              break
            fi
            if [ $attempt -lt 3 ]; then
              echo "  ⚠️ Attempt $attempt failed, retrying in 10 seconds..."
              sleep 10
            else
              echo "  ❌ Feed $feed failed after 3 attempts."
              # 检查是否是 mtk_driver，尝试用备用源
              if [ "$feed" = "mtk_driver" ]; then
                echo "  🔄 Trying alternative source for mtk_driver..."
                sed -i 's|padavanonly/immortalwrt-mt7981|hanwckf/immortalwrt-mt798x|g' feeds.conf.default
                echo "  📝 Updated feeds.conf.default:"
                cat feeds.conf.default
                if ./scripts/feeds update $feed; then
                  echo "  ✅ Feed $feed updated successfully with alternative source."
                  break
                else
                  echo "  ❌ Alternative source also failed."
                  exit 1
                fi
              else
                exit 1
              fi
            fi
          done
        done
        
        echo "=== All feeds updated ==="
        ls -la feeds/

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        
        echo "Initializing staging_dir for dae/OpenClash..."
        make tools/compile -j1 || echo "tools compile completed (with warnings)"
        make toolchain/compile -j1 || echo "toolchain compile completed (with warnings)"
        
        if [ -d "staging_dir" ]; then
          echo "✅ staging_dir generated successfully."
          ls -la staging_dir/ | head -20
        else
          echo "⚠️ WARNING: staging_dir not found, continuing anyway..."
        fi
        
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/* 2>/dev/null || true
        if [ -d "$PWD" ] && [ -f "$PWD/packages" ]; then
          rm -rf packages
        fi
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        [ ${UPLOAD_GOFILE} = true && ${{ steps.gofile.outputs.url }} ] && echo "🔗 [GoFile](${{ steps.gofile.outputs.url }})" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 2

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 10
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
