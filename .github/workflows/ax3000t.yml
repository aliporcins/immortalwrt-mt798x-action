name: Build ImmortalWrt for AX3000T

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential ccache ecj fastjar file g++ gawk \
          gettext git java-propose-classpath libelf-dev libncurses5-dev \
          libncursesw5-dev libssl-dev python3 python3-pip python3-venv \
          python3-distutils python3-dev rsync subversion swig time \
          unzip wget xsltproc zlib1g-dev

    - name: Clone ImmortalWrt source
      run: |
        git clone https://github.com/immortalwrt/immortalwrt.git openwrt
        cd openwrt
        git checkout openwrt-21.02

    - name: Add custom feeds
      run: |
        cd openwrt
        echo "src-git daed https://github.com/QiuSimons/OpenWrt-Add.git" >> feeds.conf.default
        echo "src-git dae https://github.com/daeuniverse/dae-openwrt.git" >> feeds.conf.default

    - name: Update feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a

    - name: Install feeds with golang fix
      run: |
        cd openwrt
        
        # 清理旧的 feed 缓存
        rm -rf feeds/packages
        
        # 更新所有 feeds
        ./scripts/feeds update -a
        
        # 安装所有 feeds
        ./scripts/feeds install -a
        
        # 专门确保 golang 包已安装
        ./scripts/feeds install -p packages golang
        
        # 验证 golang-package.mk 是否存在
        echo "Checking for golang-package.mk..."
        if [ ! -f "feeds/packages/lang/golang/golang-package.mk" ]; then
          echo "⚠️  golang-package.mk not found! Attempting manual fix..."
          
          # 创建目录
          mkdir -p feeds/packages/lang/golang
          
          # 从 OpenWrt 官方仓库下载
          wget -O feeds/packages/lang/golang/golang-package.mk \
            https://raw.githubusercontent.com/openwrt/packages/master/lang/golang/golang-package.mk
          
          # 如果 wget 失败，尝试从 immortalwrt 的 packages 获取
          if [ ! -f "feeds/packages/lang/golang/golang-package.mk" ]; then
            wget -O feeds/packages/lang/golang/golang-package.mk \
              https://raw.githubusercontent.com/immortalwrt/packages/master/lang/golang/golang-package.mk
          fi
        fi
        
        # 最终验证
        if [ -f "feeds/packages/lang/golang/golang-package.mk" ]; then
          echo "✅ golang-package.mk found successfully"
          ls -la feeds/packages/lang/golang/golang-package.mk
        else
          echo "❌ golang-package.mk still missing"
          echo "Available files in feeds/packages/lang/:"
          ls -la feeds/packages/lang/ 2>/dev/null || echo "lang directory not found"
          exit 1
        fi
        
        # 重新安装 dae 相关包
        ./scripts/feeds install dae
        ./scripts/feeds install daed

    - name: Validate build environment
      run: |
        cd openwrt
        echo "=== Validating build environment ==="
        
        # 验证关键文件
        if [ -f "feeds/packages/lang/golang/golang-package.mk" ]; then
          echo "✅ golang-package.mk exists"
        else
          echo "❌ golang-package.mk missing"
          exit 1
        fi
        
        # 检查 dae 包是否存在
        if [ -d "package/feeds/daed/dae" ] || [ -d "feeds/daed/dae" ]; then
          echo "✅ dae package found"
        else
          echo "⚠️  dae package not found, checking..."
          ./scripts/feeds install dae
        fi

    - name: Copy configuration
      run: |
        cd openwrt
        # 复制配置文件
        if [ -f "$GITHUB_WORKSPACE/mt7981-ax3000t.config" ]; then
          cp $GITHUB_WORKSPACE/mt7981-ax3000t.config .config
        else
          # 如果没有配置文件，使用默认配置
          make defconfig
        fi
        
        # 确保 dae 包被启用
        echo "CONFIG_PACKAGE_dae=y" >> .config
        echo "CONFIG_PACKAGE_daed=y" >> .config
        
        # 生成最终配置
        make defconfig
        
        echo "=== Configuration summary ==="
        grep -E "CONFIG_PACKAGE_dae|CONFIG_PACKAGE_daed" .config || echo "⚠️  dae not in config"

    - name: Build dae package first
      run: |
        cd openwrt
        echo "=== Building dae package ==="
        make package/feeds/daed/dae/compile V=s || {
          echo "⚠️  dae build failed, installing missing dependencies..."
          ./scripts/feeds install -a
          make package/feeds/daed/dae/compile V=s || {
            echo "❌ dae build failed, continuing without dae"
            # 禁用 dae 继续构建
            sed -i '/CONFIG_PACKAGE_dae/d' .config
            sed -i '/CONFIG_PACKAGE_daed/d' .config
            echo "# CONFIG_PACKAGE_dae is not set" >> .config
            echo "# CONFIG_PACKAGE_daed is not set" >> .config
            make defconfig
          }
        }

    - name: Build firmware
      run: |
        cd openwrt
        echo "=== Building firmware ==="
        # 使用所有 CPU 核心构建，如果失败则单核心重试
        make -j$(nproc) V=s || make -j1 V=s

    - name: Prepare artifacts
      run: |
        cd openwrt
        mkdir -p artifacts
        echo "=== Collecting artifacts ==="
        # 查找所有固件文件
        if [ -d "bin/targets/" ]; then
          find bin/targets/ -type f \( -name "*.bin" -o -name "*.itb" -o -name "*.img" -o -name "*.tar.gz" \) -exec cp {} artifacts/ \;
        fi
        
        # 如果 artifacts 为空，输出提示
        if [ -z "$(ls -A artifacts/)" ]; then
          echo "⚠️  No artifacts found"
        else
          echo "✅ Artifacts collected:"
          ls -la artifacts/
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: immortalwrt-ax3000t-firmware
        path: openwrt/artifacts/
        retention-days: 30

    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: openwrt/logs/
        retention-days: 7
