- name: Update feeds
  run: |
    cd openwrt
    
    # 配置 Git 以处理网络问题
    git config --global url."https://".insteadOf git://
    git config --global core.compression 0
    git config --global http.postBuffer 1048576000
    git config --global http.lowSpeedLimit 0
    git config --global http.lowSpeedTime 999999
    
    # 添加重试逻辑
    echo "🔄 Starting feeds update with retry..."
    for attempt in {1..5}; do
      echo "📡 Attempt $attempt to update feeds..."
      
      # DNS 预检查
      echo "Checking DNS resolution for github.com..."
      nslookup github.com || echo "⚠️ DNS lookup failed, continuing anyway..."
      
      # 执行 feeds 更新
      if ./scripts/feeds update -a; then
        echo "✅ Feed update successful on attempt $attempt"
        break
      fi
      
      if [ $attempt -lt 5 ]; then
        echo "⚠️ Feed update failed (attempt $attempt), retrying in 15 seconds..."
        sleep 15
      else
        echo "❌ Feed update failed after 5 attempts"
        exit 1
      fi
    done
